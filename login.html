
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palabok Community | Login</title>
  <meta name="theme-color" content="#111827">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #111827, #312e81, #111827);
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      text-align: center;
      background: rgba(17, 24, 39, .94);
      border: 1px solid #374151;
      border-radius: 20px;
      box-shadow: 0 20px 60px #0008;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 { margin: 8px 0; font-size: 27px; }

    .subtitle {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .discord-btn {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      background: #5865F2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .discord-btn:hover { background: #4752c4; }

    .discord-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      display: none;
      margin-top: 20px;
      padding: 13px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .info {
      display: block !important;
      background: #1e3a8a;
      color: #dbeafe;
    }

    .success {
      display: block !important;
      background: #064e3b;
      color: #d1fae5;
    }

    .error {
      display: block !important;
      background: #7f1d1d;
      color: #fee2e2;
    }

    .footer {
      color: #6b7280;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">🍜</div>

    <h1>Palabok Community</h1>

    <p class="subtitle">
      Welcome! Sign in using your Discord account
      to access the community portal.
    </p>

    <a
      id="discordLogin"
      class="discord-btn"
      href="https://palabok-discord-auth.castillanojomer10.workers.dev/auth/discord"
    >
      Login with Discord
    </a>

    <div id="status" role="status" aria-live="polite"></div>

    <div class="footer">
      Palabok Community Portal
    </div>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth,
      signInWithCustomToken
    } from
      "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBtu_ambv4HRDJwboKwieKD7JcbOdyhJmc",
      authDomain: "palabok-community.firebaseapp.com",
      projectId: "palabok-community",
      storageBucket: "palabok-community.firebasestorage.app",
      messagingSenderId: "860619525916",
      appId: "1:860619525916:web:44f65c7e4e9f66dc2d74d9",
      measurementId: "G-LR9VNJ0V3C"
    };

    const WORKER_URL =
      "https://palabok-discord-auth.castillanojomer10.workers.dev";

    const DASHBOARD_URL =
      "https://palaboks.github.io/Palabok/dashboard.html";

    const statusBox = document.getElementById("status");
    const loginButton = document.getElementById("discordLogin");

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = type;
    }

    loginButton.href = WORKER_URL + "/auth/discord";

    async function startLogin() {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const params = new URLSearchParams(
        window.location.hash.substring(1)
      );

      const token = params.get("firebaseCustomToken");
      const error = new URLSearchParams(
        window.location.search
      ).get("error");

      // Remove token/error from browser address bar.
      if (window.location.hash || error) {
        window.history.replaceState(
          null,
          "",
          window.location.pathname
        );
      }

      if (error) {
        showStatus(
          "Discord login error: " + error,
          "error"
        );
        return;
      }

      if (!token) {
        return;
      }

      loginButton.style.display = "none";

      showStatus(
        "Connecting to Firebase. Please wait...",
        "info"
      );

      try {
        await signInWithCustomToken(auth, token);

        showStatus(
          "Login successful! Opening your dashboard...",
          "success"
        );

        window.location.replace(DASHBOARD_URL);

      } catch (err) {
        console.error("Firebase login error:", err);

        showStatus(
          "Firebase login failed: " +
          (err.code || err.message) +
          ". Please check the Cloudflare Worker configuration.",
          "error"
        );

        loginButton.style.display = "block";
      }
    }

    startLogin().catch(error => {
      console.error(error);

      showStatus(
        "Unable to initialize Firebase: " + error.message,
        "error"
      );
    });
  </script>
</body>
</html>
